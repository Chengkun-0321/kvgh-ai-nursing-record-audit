services:
  backend:
    build:
      context: ./backend
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    env_file:
      - ./backend/.env
    environment:
      # 覆寫主機 .env 的路徑，避免容器誤用 Mac／Linux 主機絕對路徑。
      DATA_DIR: /app/data
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      CHATGPT_TOKEN_DIR: /app/data/chatgpt
      HOSPITAL_DATA_DIR: /hospital-data
      CORS_ORIGINS: '${CORS_ALLOWED_ORIGINS:-[]}'
    volumes:
      - "${BACKEND_DATA_DIR:-./backend/data}:/app/data"
      - "${HOSPITAL_DATA_HOST_DIR:-./data}:/hospital-data:ro"
    healthcheck:
      # /api/v1/* 需登入會回 401；openapi.json 不需登入、不碰 DB 與外部模型，且 nginx 不對外轉送此路徑
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports:
      # 前方另有主機 nginx 處理 HTTPS 時，FRONTEND_BIND_ADDRESS 設 127.0.0.1，只讓本機連入
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3000}:8080"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
