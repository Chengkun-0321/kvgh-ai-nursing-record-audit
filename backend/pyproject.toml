# 僅放工具設定；依賴由 requirements.txt / requirements-dev.txt 管理

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle、pyflakes
  "I",            # import 排序
  "N",            # 命名
  "UP",           # 新語法
  "B",            # 常見 bug
  "SIM",          # 簡化
  "C90",          # 循環複雜度
  "PL",           # pylint（參數數、分支數、magic value）
  "RUF",
  "ASYNC",        # async 內阻塞呼叫
  "S",            # 資安
  "T20",          # 禁用 print
  "PTH",          # 使用 pathlib
  "ERA",          # 禁止註解掉的程式碼
]
# 允許字串、註解、docstring 使用全形中文標點
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-branches = 8
max-returns = 4
max-statements = 30

[tool.ruff.lint.per-file-ignores]
# FastAPI endpoint 的 Depends 參數常超過 4 個
"app/api/**" = ["PLR0913"]
# 測試使用虛構的金鑰與 token 字串
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# LiteLLM 的型別定義在 pydantic 產生 schema 時的提示，與本專案無關
filterwarnings = [
    "ignore:Item 'summary' on TypedDict class 'ChatCompletionReasoningItem':UserWarning",
]
